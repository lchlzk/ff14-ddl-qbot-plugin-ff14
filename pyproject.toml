[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ff14-ddl-qbot-plugin-ff14"
version = "0.2.0"
description = "FF14 command plugins for ff14-ddl-qbot"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = ["nonebot2>=2.5,<3", "nonebot-adapter-qq>=1.7,<2", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["plugins*", "qbot_ff14*"]

[tool.setuptools.package-data]
"plugins" = ["data/*.tsv"]
